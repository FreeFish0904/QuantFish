name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Ruff
        run: python -m ruff check backend --output-format=github

  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Run pytest
        run: |
          set -o pipefail
          python -m pytest backend/tests -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"

      - name: Annotate pytest failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' "${RUNNER_TEMP}/pytest.log" \
            | head -25 \
            | sed 's/^/::error title=pytest failure::/' || true

  api-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Regenerate frontend API types
        run: npm --prefix frontend run api-types

      - name: Fail on schema drift
        run: |
          if ! git diff --exit-code -- frontend/src/shared/api/generated/api-types.ts; then
            echo "::error title=OpenAPI drift::api-types.ts is out of date. Run 'npm --prefix frontend run api-types' and commit the result."
            exit 1
          fi

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run vitest
        run: npm --prefix frontend test -- --run

      - name: Type-check and build
        run: npm --prefix frontend run build

      - name: Build static demo bundle
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm --prefix frontend run build
