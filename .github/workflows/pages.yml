name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build demo bundle
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm --prefix frontend run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        # The site itself has to be created once by a repository admin:
        # Settings → Pages → Build and deployment → Source: GitHub Actions.
        # The workflow token is not allowed to create the site (an `enablement:
        # true` input used to exist but fails with "Resource not accessible by
        # integration" on personal repositories).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
