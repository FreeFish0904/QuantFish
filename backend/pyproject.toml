[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfish"
version = "0.1.0"
description = "Classroom factor research platform data tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "matplotlib",
  "pandas",
  "pyarrow",
  "python-multipart",
  "PyYAML",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "pytest-cov",
  "ruff",
]
# Optional PDF report rendering (matplotlib plots + weasyprint layout).
pdf = [
  "jinja2>=3.1",
  "weasyprint>=62",
]

[project.scripts]
quantfish-web = "quantfish.web_app.app:main"
quantfish-export-monitor = "quantfish.student_exports.monitor:main"
quantfish-offline-runtime = "quantfish.student_exports.runtime_packages:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantfish = ["**/*.html", "**/*.css", "**/*.svg", "**/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A leaked `sqlite3.Connection` (and its file descriptor plus WAL handles) only
# surfaces as a `ResourceWarning` when someone turns warnings back on, so the
# leak in `SubmissionRepository` stayed invisible for a long time. Fail the run
# instead: `PytestUnraisableExceptionWarning` is how pytest reports those
# warnings when they fire during garbage collection.
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

# Lint gate for `backend/`. Run from the repository root: `ruff check backend`.
# E501 (line length) stays disabled for now so the first pass is behavioural
# only; formatting lives in `[tool.ruff.format]` and is applied separately.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",
  # The code base intentionally uses typographic characters in user-facing
  # strings (the U+2212 minus sign, Chinese punctuation, en dashes).
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.coverage.run]
branch = true
source = ["quantfish"]

# Report only for now: the first measured baseline is 88% (8350 statements,
# 991 missed). Once the number is stable in CI, add
# `fail_under = <baseline - 3>` so new untested code cannot slip in.
[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

