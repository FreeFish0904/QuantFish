name: quantfish-demo

services:
  quantfish:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: quantfish-demo:latest
    ports:
      - "8010:8010"
    environment:
      QUANTFISH_HOST: 0.0.0.0
      QUANTFISH_PORT: "8010"
      QUANTFISH_CONFIG: config/platform.demo.yaml
      QUANTFISH_RUNTIME_ROOT: runs/web_platform
    volumes:
      - quantfish-runtime:/app/runs
    healthcheck:
      # Same script the Dockerfile uses, so the two cannot drift.
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    restart: unless-stopped

volumes:
  quantfish-runtime:
